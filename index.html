<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCENSOR 13 | ESTACIÓN CENTRAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&family=Special+Elite&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0505;
            --rust-dark: #2a1a15;
            --rust-light: #5a3a30;
            --metal: #252525;
            --bulb-on: #ff4500;
            --warm-light: rgba(255, 245, 220, 0.4);
            --paper: #d8c8b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background: var(--bg);
            height: 100vh; overflow: hidden; color: #ccc;
            display: flex; justify-content: center; align-items: center;
            perspective: 1200px; font-family: 'Courier Prime', monospace;
        }

        .realistic-metal {
            background-color: var(--metal);
            background-image: 
                url('https://www.transparenttextures.com/patterns/brushed-alum-dark.png'),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.7) 100%);
            background-blend-mode: overlay, multiply, normal;
            border: 1px solid #111;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }

        /* --- PANTALLA INICIO --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        .start-btn {
            background: transparent; color: #aaa; border: 4px solid #555;
            padding: 20px 50px; font-family: 'Anton'; font-size: 2rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px; transition: 0.3s;
        }
        .start-btn:hover { border-color: var(--rust-light); color: #fff; box-shadow: 0 0 30px var(--rust-dark); }

        /* --- ESCENARIO --- */
        #stage { position: relative; width: 100%; height: 100%; max-width: 1400px; transform-style: preserve-3d; }

        .ceiling {
            position: absolute; top: -15%; left: 10%; width: 80%; height: 35%;
            transform: rotateX(75deg); z-index: 5;
            display: flex; justify-content: center;
            background: #1a1a1a; border-bottom: 8px solid #000;
        }
        .fluorescent-tube {
            width: 60%; height: 15px; background: #fffce0; margin-top: 60px;
            box-shadow: 0 0 60px var(--warm-light); border-radius: 4px;
            animation: badFluorescent 5s infinite;
        }

        /* --- PANELES --- */
        .control-panel-box {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 500;
            padding: 20px 15px; border-radius: 4px; border: 4px solid #111;
            pointer-events: auto;
        }
        .panel-left { left: 4%; transform: translateY(-50%) rotateY(25deg) translateZ(100px); width: 140px; }
        .panel-right { right: 4%; transform: translateY(-50%) rotateY(-25deg) translateZ(100px); width: 150px; }
        
        .grill-heavy { width: 100%; height: 50px; background: repeating-linear-gradient(0deg, #111, #111 4px, #333 5px); border: 2px solid #000; margin-bottom: 10px; }
        .analog-led { width: 12px; height: 12px; background: #300; border-radius: 50%; margin: 0 auto; border: 2px solid #000; }
        .analog-led.active { background: #f00; box-shadow: 0 0 15px #f00; }

        .buttons-grid { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .phys-btn {
            width: 42px; height: 42px; border-radius: 50%; background: #2a2a2a;
            border: 3px solid #3a3a3a; color: #666; font-family: 'Anton'; font-size: 1.1rem;
            display: grid; place-items: center; cursor: pointer; transition: all 0.1s;
        }
        .phys-btn:hover { border-color: #555; color: #999; }
        .phys-btn.active { background: #8b0000; color: #fff; box-shadow: 0 0 15px var(--bulb-on); border-color: #ff4500; }

        /* --- ESPEJO REALISTA Y ENTIDADES --- */
        .mirror-frame {
            position: absolute; top: 5%; left: 22%; width: 56%; height: 90%;
            transform: translateZ(-200px); background: #000; border: 20px solid #1a1a1a; overflow: hidden;
            z-index: 1; box-shadow: inset 0 0 80px #000;
        }
        
        /* 1. ESTÁTICA GENERADA POR CSS (SIN IMAGEN EXTERNA PARA EVITAR ERRORES) */
        .no-signal-bg {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-color: #111;
            /* Patrón de ruido generado con gradientes */
            background-image: repeating-linear-gradient(transparent 0px, transparent 1px, rgba(255,255,255,0.08) 1px, rgba(255,255,255,0.08) 2px);
            background-size: 100% 4px;
            animation: staticNoise 0.2s infinite linear;
            z-index: 0;
            display: none; /* Se activa con JS */
        }

        /* 2. Video Webcam */
        video#webcam { 
            width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); 
            filter: grayscale(100%) brightness(0.4) contrast(1.3) sepia(0.3); 
            position: relative; z-index: 1; 
        }

        /* 3. Capa de Suciedad (Grunge) */
        .mirror-grime {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/black-felt.png'); 
            opacity: 0.5; z-index: 5; pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* 4. Capa de Reflejo de Luz */
        .mirror-reflection {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 60%, transparent 65%);
            z-index: 6; pointer-events: none;
        }

        /* 5. Capa de Entidades */
        #shadow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-end;
        }
        
        .entity {
            position: absolute; width: 100%; height: 100%; top:0; left:0;
            background-size: contain; background-position: center bottom; background-repeat: no-repeat;
            opacity: 0; transition: opacity 2s ease-in-out;
            mix-blend-mode: normal; 
        }

        /* Imágenes de Entidades (URLs actualizadas/verificadas) */
        #entity-death { background-image: url('https://cdn.pixabay.com/photo/2013/07/12/12/55/grim-reaper-146552_1280.png'); }
        #entity-doubt { background-image: url('https://cdn.pixabay.com/photo/2016/11/14/03/38/achieve-1822503_1280.png'); filter: blur(3px) brightness(0.5); }
        #entity-marta { background-image: url('https://cdn.pixabay.com/photo/2016/03/31/19/58/avatar-1295429_1280.png'); }

        .entity.active { opacity: 0.9; transform: scale(1.05); transition: transform 6s ease-out, opacity 0.5s; }


        /* --- PUERTAS Y DISPLAY --- */
        .door { position: absolute; top: 0; width: 50.5%; height: 100%; z-index: 100; transition: transform 3.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .door-l { left: 0; border-right: 5px solid #000; }
        .door-r { right: 0; border-left: 5px solid #000; }
        body.open .door-l { transform: translateX(-95%); }
        body.open .door-r { transform: translateX(95%); }

        .display-analog { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: #000; padding: 5px 30px; border: 4px solid #333; z-index: 200; width: 220px; text-align: center; overflow: hidden;}
        #floor-txt { font-family: 'Anton'; font-size: 2.2rem; color: var(--bulb-on); text-shadow: 0 0 10px var(--bulb-on); white-space: nowrap; transition: font-size 0.2s; }

        /* --- TARJETA DOSSIER --- */
        .content-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 300; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        .dossier-card {
            width: 440px; background: var(--paper); background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            color: #222; padding: 25px; transform: translateY(30px); opacity: 0; transition: 0.6s; pointer-events: auto;
            box-shadow: 0 20px 50px #000; border: 1px solid #887766;
        }
        .dossier-card.visible { opacity: 1; transform: translateY(0); }
        .stamp { border: 2px solid var(--rust-dark); color: var(--rust-dark); font-family: 'Special Elite'; font-weight: bold; padding: 4px 8px; display: inline-block; transform: rotate(-2deg); margin-bottom: 12px; font-size: 0.75rem; }
        .action-link { display: inline-block; padding: 10px 20px; background: #222; color: #ddd; font-family: 'Rajdhani'; font-weight: 700; cursor: pointer; border: none; width: 100%; text-align: center; text-transform: uppercase; margin-top: 10px; }

        /* --- MODAL --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 10000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            width: 650px; max-width: 90%; max-height: 80vh; background: var(--paper);
            padding: 40px; position: relative; overflow-y: auto;
            box-shadow: 0 0 100px #000; font-family: 'Special Elite'; color: #111; line-height: 1.4;
        }
        .close-modal { position: absolute; top: 10px; right: 20px; font-size: 2.5rem; cursor: pointer; color: #000; }
        .sketch-img { width: 100%; margin: 15px 0; border: 1px solid #000; filter: sepia(0.5) contrast(1.1); }
        
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .social-box { border: 1px dashed #333; padding: 10px; text-align: center; background: rgba(0,0,0,0.05); }

        @keyframes badFluorescent { 0%, 100% { opacity: 1; } 86% { opacity: 0.3; } 93% { opacity: 0.1; } }
        @keyframes staticNoise { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }
    </style>
</head>
<body class="closed">

    <div id="intro-overlay">
        <h1 style="font-family:'Anton'; font-size:4rem; color:#aaa; margin-bottom: 5px;">ASCENSOR 13</h1>
        <p style="font-family:'Special Elite'; color: #444; margin-bottom: 30px;">PROYECTO INDIE // ESTACIÓN CENTRAL</p>
        <button class="start-btn" onclick="initSite()">LLAMAR</button>
    </div>

    <div id="stage">
        <div class="ceiling realistic-metal"><div class="fluorescent-tube"></div></div>

        <div class="control-panel-box panel-left realistic-metal">
            <div class="grill-heavy"></div>
            <div class="analog-led" id="voice-led"></div>
            <p style="font-family:'Rajdhani'; font-size: 0.6rem; text-align: center; color: #555; margin-top: 8px; font-weight: bold;">INTERCOM</p>
        </div>

        <div class="control-panel-box panel-right realistic-metal">
            <div class="buttons-grid">
                <div class="phys-btn" id="btn-0" onclick="travel(0)">G</div>
                <div class="phys-btn" id="btn-1" onclick="travel(1)">1</div>
                <div class="phys-btn" id="btn-2" onclick="travel(2)">2</div>
                <div class="phys-btn" id="btn-3" onclick="travel(3)">3</div>
                <div class="phys-btn" id="btn-5" onclick="travel(5)">5</div>
                <div class="phys-btn" id="btn-7" onclick="travel(7)">7</div>
                <div class="phys-btn" id="btn-9" onclick="travel(9)">9</div>
                <div class="phys-btn" id="btn-10" onclick="travel(10)" style="color:#6a6; border-color: #242;">INFO</div>
                <div class="phys-btn" id="btn-13" onclick="travel(13)" style="color:#f66; border-color: #522;">13</div>
            </div>
        </div>

        <div class="mirror-frame">
            <div class="mirror-grime"></div>
            <div class="mirror-reflection"></div>
            <div class="no-signal-bg" id="static-bg"></div>
            
            <video id="webcam" autoplay playsinline muted></video>
            
            <div id="shadow-layer">
                <div class="entity" id="entity-death"></div>
                <div class="entity" id="entity-doubt"></div>
                <div class="entity" id="entity-marta"></div>
            </div>
        </div>

        <div class="display-analog"><div id="floor-txt">--</div></div>
        <div class="door door-l realistic-metal"></div>
        <div class="door door-r realistic-metal"></div>
    </div>

    <div class="content-layer">
        <div class="dossier-card" id="main-card">
            <div class="stamp" id="c-stamp">--</div>
            <div class="card-title" id="c-title" style="font-family:'Anton'; font-size:1.8rem; color:#000; line-height: 1;"></div>
            <div class="card-body" id="c-text" style="margin: 12px 0 18px 0; font-size: 0.85rem;"></div>
            <button class="action-link" id="c-btn" onclick="openDetails()">EXAMINAR</button>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const voiceConfig = {
            '0': { pitch: 0.8, rate: 0.9 }, // Normal
            '1': { pitch: 0.1, rate: 0.6 }, // MUERTE
            '2': { pitch: 1.8, rate: 1.3 }, // DUDA
            '3': { pitch: 0.5, rate: 1.5 }, // TIEMPO
            '5': { pitch: 0.1, rate: 0.5 }, // MUERTE
            '7': { pitch: 1.0, rate: 1.0 }, // ESPEJO
            '9': { pitch: 1.2, rate: 0.9 }, // MARTA
            '10': { pitch: 0.7, rate: 1.1 }, // SISTEMA
            '13': { pitch: 1.0, rate: 0.8 }  // FINAL
        };

        const content = {
            '0': { 
                stamp: "REGISTRO ENTRADA", title: "LA ESTACIÓN", 
                text: "Entro en la estación. Pero hoy, el ascensor de la derecha me espera abierto.", 
                btn: "LEER INTRODUCCIÓN", voice: "Piso G. Bienvenido a la vía muerta.",
                details: "<h3>EL ERROR TÉCNICO</h3><p>En los planos, este hueco no existe. Solo aparece cuando no quieres enfrentarte a algo.</p>"
            },
            '1': { 
                stamp: "EXPEDIENTE #892", title: "MARÍA: EL RECUERDO", 
                text: "Nunca superaste ese 'no'. Solo lo guardaste... hasta que pesó más que tú.", 
                btn: "VER EXPEDIENTE", voice: "Piso 1. El recuerdo. María está muerta en tu memoria.",
                details: "<h3>LA HERIDA ANTIGUA</h3><p><b>Muerte:</b> 'La muerte no es solo el fin. Es el momento en que algo dentro de ti deja de moverse'.</p>",
                entity: 'entity-death'
            },
            '2': { 
                stamp: "INTERCEPCIÓN SENSORIAL", title: "LA DUDA", 
                text: "Soy esa cosquilla que te dice 'no te abras de nuevo, te destruirán otra vez'.", 
                btn: "ESCUCHAR DUDA", voice: "¡Piso 2! ¡Escucha! ¡Te van a hacer daño! ¡No salgas!",
                details: "<h3>VOZ DE LA DUDA</h3><p>'Soy la que te mantuvo lejos de Marta. Para protegerte. Porque si no hablas, no te pueden rechazar'.</p>",
                entity: 'entity-doubt'
            },
            '3': { 
                stamp: "DATOS DEGRADADOS", title: "EL TIEMPO", 
                text: "Soy el que corre, el que se agota aunque no quieras. Tic, tac.", 
                btn: "VER RELOJ", voice: "Piso 3. Tic tac. Se acaba el tiempo, Álex.",
                details: "<h3>CRONOLOGÍA DEL MIEDO</h3><p>Dijiste 'mañana se lo digo'. Pero el mañana nunca llegó.</p>"
            },
            '5': { 
                stamp: "CARGA COGNITIVA", title: "LAS ENTIDADES", 
                text: "No viajas solo. Mira bien el espejo. ¿Ves esa sombra?", 
                btn: "VER BOCETOS", voice: "Piso 5. Te veo. Siempre estoy detrás de ti.",
                details: "<h3>SOMBRA DE LA MUERTE</h3><p>Una figura alta y oscura que siempre te acompaña.</p>",
                entity: 'entity-death'
            },
            '7': { 
                stamp: "REFLEJO DISTORSIONADO", title: "EL ESPEJO", 
                text: "Tu reflejo se mueve segundos antes que tú. Es más sincero de lo que te atreves a ser.", 
                btn: "MIRAR REFLEJO", voice: "Piso 7. Mírate. Eres patético.",
                details: "<h3>DIÁLOGO CON EL ESPEJO</h3><p>REFLEJO: 'Ensayas sonrisas ingeniosas... y luego cuando llega Marta, solo dices hola'.</p>"
            },
            '9': { 
                stamp: "LLAMADA ENTRANTE", title: "MARTA", 
                text: "Marta responde. ¿Vas a hablar o vas a colgar?", 
                btn: "ABRIR INTERCOM", voice: "¿Álex? ¿Estás ahí? Por favor, contesta.",
                details: "<h3>MARTA</h3><p>Marta: 'Siempre te he visto fuerte... pero si estás temblando, puedo esperarte'.</p>",
                entity: 'entity-marta'
            },
            '10': { 
                stamp: "ARCHIVO DE MANTENIMIENTO", title: "DESARROLLO", 
                text: "Detrás de los muros de la estación hay un equipo creando esta pesadilla.", 
                btn: "VER CRÉDITOS", voice: "Accediendo a los archivos de desarrollo.",
                details: "<h3>CRÉDITOS</h3><p>Creado por Álex y la IA.</p>"
            },
            '13': { 
                stamp: "REINICIO TOTAL", title: "LA SALIDA", 
                text: "Las puertas se abren. Ella está ahí de verdad. Es hora de ser real.", 
                btn: "SALIR", voice: "Piso 13. Última oportunidad. Vive.",
                details: "<h3>SALIDA</h3><p>Marta está esperando.</p><button class='action-link' onclick='location.reload()' style='margin-top:20px'>SALIR DEL BUCLE</button>"
            }
        };

        const subliminalMessages = [
            "¿LO HARÁS?", "O ESPERAR...", "NO EXISTE",
            "MOMENTO IDEAL", "ES EL FIN", "¿YA NO LA VES?", 
            "MAÑANA SEGURO", "MAÑANA MIENTE", "SE ACABA", 
            "DÍSELO YA", "COBARDE", "NO HAY TIEMPO", "E R R O R"
        ];

        let audioCtx; let isMoving = false; let currentFloor = null;
        let ambientGain; let glitchInterval;
        let hasCamera = false;

        async function initSite() {
            const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC();
            try { 
                const stream = await navigator.mediaDevices.getUserMedia({ video: true }); 
                document.getElementById('webcam').srcObject = stream; 
                hasCamera = true;
            } catch(e) { 
                console.log("Cámara no disponible, activando modo sin señal.");
                document.getElementById('static-bg').style.display = 'block';
                document.getElementById('webcam').style.display = 'none';
                
                // IMPORTANTE: Si no hay cámara, hacemos que las entidades brillen o tengan alto contraste
                document.querySelectorAll('.entity').forEach(el => {
                    el.style.mixBlendMode = 'normal'; // Quitamos modos de fusión complejos
                    el.style.filter = 'contrast(1.5) brightness(1.2) drop-shadow(0 0 10px rgba(255,0,0,0.3))';
                });
                hasCamera = false;
            }
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => document.getElementById('intro-overlay').remove(), 1000);
            playAmbient(); travel(0);
        }

        function getGlitchText() {
            if(Math.random() > 0.3) {
                const msg = subliminalMessages[Math.floor(Math.random() * subliminalMessages.length)];
                return msg.split('').map(c => Math.random() > 0.92 ? '#' : (Math.random() > 0.92 ? 'Ø' : c)).join('');
            } else { return Math.random() > 0.5 ? "MOV..." : "---"; }
        }

        function triggerShadowEffect(floor) {
            const floorData = content[floor];
            if(floorData && floorData.entity) {
                const element = document.getElementById(floorData.entity);
                if(element) {
                    element.classList.add('active');
                    setTimeout(() => {
                        element.classList.remove('active');
                    }, 6000);
                }
            } else {
                if(Math.random() > 0.7) {
                    document.getElementById('entity-doubt').classList.add('active');
                    setTimeout(() => document.getElementById('entity-doubt').classList.remove('active'), 4000);
                }
            }
        }

        function travel(floor) {
            if(isMoving || floor === currentFloor) return; 
            isMoving = true;
            document.querySelectorAll('.phys-btn').forEach(b => b.classList.remove('active'));
            const targetBtn = document.getElementById(`btn-${floor}`);
            if(targetBtn) targetBtn.classList.add('active');
            document.getElementById('main-card').classList.remove('visible');
            playSfx('click', 0.1);
            document.body.className = "closed";

            document.querySelectorAll('.entity').forEach(e => e.classList.remove('active'));

            const display = document.getElementById('floor-txt');
            display.style.color = "#ff3333"; display.style.fontSize = "1.2rem";

            glitchInterval = setInterval(() => {
                display.innerText = getGlitchText();
                display.style.opacity = Math.random() > 0.6 ? 1 : 0.4;
            }, 180);

            setTimeout(() => {
                const motor = playSfx('motor', 0.02);
                document.querySelector('.fluorescent-tube').style.animationDuration = "0.3s";
                
                setTimeout(() => {
                    clearInterval(glitchInterval);
                    motor.stop(); playSfx('ding', 0.05);
                    
                    display.style.color = "var(--bulb-on)"; display.style.fontSize = "2.2rem"; display.style.opacity = 1;
                    currentFloor = floor;
                    display.innerText = floor === 10 ? "INF" : (floor === 0 ? "G" : floor);
                    
                    document.body.className = "open";
                    triggerShadowEffect(floor);
                    
                    document.querySelector('.fluorescent-tube').style.animationDuration = "5s";
                    
                    setTimeout(() => {
                        const data = content[floor];
                        document.getElementById('c-stamp').innerText = data.stamp;
                        document.getElementById('c-title').innerText = data.title;
                        document.getElementById('c-text').innerText = data.text;
                        document.getElementById('c-btn').innerText = data.btn;
                        document.getElementById('main-card').classList.add('visible');
                        
                        speak(data.voice, floor);
                        
                        isMoving = false;
                    }, 1200);
                }, 3000);
            }, 1000);
        }

        function playAmbient() {
            const osc = audioCtx.createOscillator(); ambientGain = audioCtx.createGain();
            osc.type='sine'; osc.frequency.value=50; ambientGain.gain.value=0.01;
            osc.connect(ambientGain); ambientGain.connect(audioCtx.destination); osc.start();
        }

        function playSfx(type, vol) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now=audioCtx.currentTime;
            gain.gain.setValueAtTime(vol, now);
            if(type==='click'){ osc.frequency.setValueAtTime(400,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.1); osc.start(); osc.stop(now+0.1); }
            if(type==='ding'){ osc.type='triangle'; osc.frequency.setValueAtTime(440,now); gain.gain.exponentialRampToValueAtTime(0.001,now+1.5); osc.start(); osc.stop(now+1.5); }
            if(type==='motor'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(30,now); osc.start(); return {stop:()=>{gain.gain.linearRampToValueAtTime(0,now+1);osc.stop(now+1);}}}
        }

        function speak(text, floor) { 
            window.speechSynthesis.cancel(); 
            const u = new SpeechSynthesisUtterance(text); 
            u.lang = 'es-ES'; 
            const config = voiceConfig[floor] || { pitch: 0.8, rate: 0.9 };
            u.pitch = config.pitch;
            u.rate = config.rate;
            const led = document.getElementById('voice-led'); led.classList.add('active');
            u.onend = () => led.classList.remove('active');
            window.speechSynthesis.speak(u); 
        }

        function openDetails() {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            body.innerHTML = content[currentFloor].details;
            modal.style.display = 'flex';
            playSfx('click', 0.1);
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    </script>
</body>
</html>
