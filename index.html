<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCENSOR 13 | ESTACIÓN CENTRAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&family=Special+Elite&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0505;
            --rust-dark: #2a1a15;
            --rust-light: #5a3a30;
            --metal: #252525;
            --bulb-on: #ff4500; /* Naranja incandescente */
            --bulb-off: #552222;
            --warm-light: rgba(255, 245, 220, 0.7); /* Luz fluorescente vieja */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background: var(--bg);
            height: 100vh; overflow: hidden; color: #ccc;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px; font-family: 'Courier Prime', monospace;
        }

        /* --- TEXTURA METAL REALISTA SUCIO --- */
        .realistic-metal {
            background-color: var(--metal);
            /* Capas: Patrón cepillado + Ruido de suciedad + Viñeta oscura */
            background-image: 
                url('https://www.transparenttextures.com/patterns/brushed-alum-dark.png'),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.7) 100%);
            background-blend-mode: overlay, multiply, normal;
            border: 1px solid #111;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }

        /* --- PANTALLA INICIO --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        .start-btn {
            background: transparent; color: #aaa; border: 4px solid #555;
            padding: 20px 50px; font-family: 'Anton'; font-size: 2rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px; transition: 0.3s;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .start-btn:hover { border-color: var(--rust-light); color: #fff; box-shadow: 0 0 30px var(--rust-dark); }

        /* --- ESCENARIO 3D --- */
        #stage {
            position: relative; width: 100%; height: 100%; max-width: 1400px;
            transform-style: preserve-3d;
        }

        /* TECHO Y LUZ FLUORESCENTE VIEJA */
        .ceiling {
            position: absolute; top: -20%; left: 10%; width: 80%; height: 40%;
            transform: rotateX(70deg); z-index: 10;
            display: flex; justify-content: center;
            background: #1a1a1a; border-bottom: 10px solid #000;
        }
        .fluorescent-tube {
            width: 70%; height: 30px; background: #fffce0; margin-top: 80px;
            box-shadow: 0 0 120px var(--warm-light); border-radius: 4px;
            animation: badFluorescent 5s infinite; /* Parpadeo irregular */
        }

        /* --- PANELES FÍSICOS PESADOS --- */
        .control-panel-box {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 100; /* Siempre visibles */
            padding: 30px 20px; border-radius: 4px;
            border: 4px solid #111;
            box-shadow: 15px 15px 50px #000, inset 2px 2px 10px rgba(255,255,255,0.1);
        }

        /* INTERFONO ANALÓGICO (Izquierda) */
        .panel-left { left: 5%; transform: translateY(-50%) rotateY(20deg) translateZ(30px); width: 150px; }
        .grill-heavy {
            width: 100%; height: 70px; background: repeating-linear-gradient(0deg, #111, #111 4px, #333 5px);
            border: 3px solid #000; margin-bottom: 15px; box-shadow: inset 0 0 15px #000;
        }
        .analog-led {
            width: 20px; height: 20px; background: #300; border-radius: 50%;
            border: 3px solid #000; box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2);
            transition: 0.1s;
        }
        .analog-led.active { background: #f00; box-shadow: 0 0 20px #f00; }

        /* BOTONERA FÍSICA (Derecha) */
        .panel-right { right: 5%; transform: translateY(-50%) rotateY(-20deg) translateZ(30px); width: 160px; }
        .buttons-grid { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .phys-btn {
            width: 65px; height: 65px; border-radius: 50%;
            /* Borde metálico + centro de plástico viejo */
            background: radial-gradient(circle at 30% 30%, #555, #222);
            border: 5px solid #444; color: #888;
            font-family: 'Anton'; font-size: 1.6rem; letter-spacing: 1px;
            display: grid; place-items: center; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 15px #000, inset 0 2px 5px rgba(255,255,255,0.1);
        }
        .phys-btn:active { transform: scale(0.96); box-shadow: 0 2px 5px #000; }
        
        .phys-btn.active {
            /* Luz incandescente encendida */
            background: radial-gradient(circle at 30% 30%, #ff8c00, #8b0000);
            color: #200; border-color: #666;
            box-shadow: 0 0 25px var(--bulb-on); text-shadow: 0 0 10px #ff8c00;
        }

        /* ESPEJO SUCIO */
        .mirror-frame {
            position: absolute; top: 5%; left: 22%; width: 56%; height: 90%;
            transform: translateZ(-250px);
            background: #000; border: 25px solid #1a1a1a; overflow: hidden;
            box-shadow: inset 0 0 150px #000; z-index: 1;
        }
        video#webcam {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
            filter: grayscale(100%) contrast(1.5) brightness(0.4) sepia(60%); opacity: 0.9;
        }
        .dirt-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; opacity: 0.6;
            background: url('https://www.transparenttextures.com/patterns/dust.png');
            mix-blend-mode: overlay;
        }
        .scratch-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; opacity: 0.3;
            background: url('https://www.transparenttextures.com/patterns/scratches.png');
        }

        /* PUERTAS PESADAS Y OXIDADA */
        .door {
            position: absolute; top: 0; width: 50%; height: 100%;
            z-index: 20; transition: transform 4s cubic-bezier(0.6, 0, 0.4, 1); /* Lento y pesado */
            box-shadow: 10px 0 100px #000;
            border-bottom: 30px solid var(--rust-dark); /* Mucho óxido abajo */
        }
        .door::after { /* Textura extra de óxido en el borde inferior */
            content:''; position:absolute; bottom:0; left:0; width:100%; height:100px;
            background: linear-gradient(to top, var(--rust-light), transparent); opacity: 0.7;
        }
        .door-l { left: 0; border-right: 6px solid #000; }
        .door-r { right: 0; border-left: 6px solid #000; }
        
        body.closed .door-l { transform: translateX(0); }
        body.closed .door-r { transform: translateX(0); }
        body.open .door-l { transform: translateX(-85%); }
        body.open .door-r { transform: translateX(85%); }

        /* DISPLAY ANALÓGICO VIEJO */
        .display-analog {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: #000; padding: 10px 40px; border: 5px solid #333; z-index: 50;
            box-shadow: 0 10px 30px #000;
        }
        #floor-txt { 
            font-family: 'Anton'; font-size: 3.5rem; color: var(--bulb-on); 
            text-shadow: 0 0 15px var(--bulb-on); letter-spacing: 5px; opacity: 0.9;
        }

        /* --- CONTENIDO (Estilo Expediente/Papel Viejo) --- */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 40; pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }
        .dossier-card {
            width: 600px; max-width: 90%;
            background: #d8c8b8; /* Color papel viejo */
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            color: #222; padding: 40px; transform: translateY(50px) rotate(-1deg);
            opacity: 0; transition: 0.5s; pointer-events: auto;
            box-shadow: 0 30px 70px #000; border: 1px solid #887766;
        }
        .dossier-card.visible { opacity: 1; transform: translateY(0) rotate(0deg); }
        
        .stamp {
            border: 3px solid var(--rust-dark); color: var(--rust-dark); font-family: 'Special Elite';
            font-weight: bold; padding: 5px 10px; display: inline-block; transform: rotate(-3deg);
            font-size: 1.2rem; margin-bottom: 20px; opacity: 0.8;
        }
        
        .card-title { font-family: 'Anton'; font-size: 3rem; margin-bottom: 15px; line-height: 1; color: #000; }
        .card-body { font-family: 'Special Elite'; font-size: 1.1rem; line-height: 1.5; margin-bottom: 25px; }
        
        .action-link {
            display: inline-block; padding: 12px 25px; background: #222; color: #ddd;
            text-decoration: none; font-family: 'Rajdhani'; font-weight: 700; text-transform: uppercase;
            transition: 0.2s; border: 2px solid #222;
        }
        .action-link:hover { background: var(--rust-light); color: #fff; border-color: var(--rust-dark); }

        /* Animaciones */
        @keyframes badFluorescent {
            0%, 100% { opacity: 1; } 85% { opacity: 1; } 86% { opacity: 0.4; } 87% { opacity: 1; }
            92% { opacity: 1; } 93% { opacity: 0.2; } 94% { opacity: 0.6; } 95% { opacity: 1; }
        }

    </style>
</head>
<body class="closed">

    <div id="intro-overlay">
        <h1 style="font-family:'Anton'; font-size:5rem; color:#aaa; text-shadow:0 0 20px #000;">ASCENSOR 13</h1>
        <p style="color:#666; font-family:'Special Elite'; letter-spacing:2px; margin-bottom:30px;">ESTACIÓN CENTRAL // VÍA MUERTA</p>
        <button class="start-btn" onclick="initSite()">LLAMAR</button>
    </div>

    <div id="stage">
        <div class="ceiling realistic-metal"><div class="fluorescent-tube"></div></div>

        <div class="control-panel-box panel-left realistic-metal">
            <div class="grill-heavy"></div>
            <div class="analog-led" id="voice-led"></div>
            <div style="font-family:'Rajdhani'; color:#555; margin-top:10px; font-weight:bold;">INTERCOM</div>
        </div>

        <div class="control-panel-box panel-right realistic-metal">
            <div class="buttons-grid">
                <div class="phys-btn" id="btn-0" onclick="travel(0)">G</div>
                <div class="phys-btn" id="btn-1" onclick="travel(1)">1</div>
                <div class="phys-btn" id="btn-5" onclick="travel(5)">5</div>
                <div class="phys-btn" id="btn-7" onclick="travel(7)">7</div>
                <div class="phys-btn" id="btn-13" onclick="travel(13)" style="color:#a55; border-color:#633;">13</div>
            </div>
        </div>

        <div class="mirror-frame realistic-metal">
            <div class="dirt-overlay"></div>
            <div class="scratch-overlay"></div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="display-analog"><div id="floor-txt">--</div></div>

        <div class="door door-l realistic-metal"></div>
        <div class="door door-r realistic-metal"></div>
    </div>

    <div class="content-layer">
        <div class="dossier-card" id="main-card">
            <div class="stamp" id="c-stamp">CONFIDENCIAL</div>
            <div class="card-title" id="c-title"></div>
            <div class="card-body" id="c-text"></div>
            <a href="#" class="action-link" id="c-btn">EXAMINAR</a>
        </div>
    </div>

    <script>
        const content = {
            '0': { stamp: "ACCESO PÚBLICO", title: "LA ESTACIÓN", text: "El ascensor de la vía muerta. Siempre estropeado, pero hoy las puertas se abren. Una novela visual de horror psicológico donde tu reflejo es el protagonista.", btn: "VER TRÁILER", voice: "Bienvenido a la estación." },
            '1': { stamp: "EXPEDIENTE #892", title: "EL ORIGEN", text: "Informe de desaparición: Último tren de la noche. María desapareció en este nivel. Hay discrepancias en tu declaración.", btn: "LEER INFORME", voice: "Piso 1. El recuerdo." },
            '5': { stamp: "PELIGRO COGNITIVO", title: "ENTIDADES", text: "No viajas solo. La Muerte, la Duda y el Tiempo se manifiestan en el espejo. Mantén la calma.", btn: "VER ARCHIVOS", voice: "Piso 5. No mires fijamente." },
            '7': { stamp: "EVIDENCIA VISUAL", title: "GALERÍA", text: "Fotografías recuperadas de la cámara de seguridad analógica. El metraje está dañado.", btn: "VER FOTOS", voice: "Piso 7. Datos corruptos." },
            '13': { stamp: "SALIDA DE EMERGENCIA", title: "EL FINAL", text: "La única salida es terminar el trayecto. Enfréntate a la realidad en el juego completo.", btn: "WISHLIST STEAM", voice: "Piso 13. Última parada." }
        };

        let audioCtx; let isMoving = false; let currentFloor = null;

        async function initSite() {
            const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC();
            try { const stream = await navigator.mediaDevices.getUserMedia({ video: true }); document.getElementById('webcam').srcObject = stream; } catch(e) {}
            document.getElementById('intro-overlay').style.opacity = 0;
            setTimeout(() => document.getElementById('intro-overlay').remove(), 800);
            playAmbient(); travel(0);
        }

        function travel(floor) {
            if(isMoving || floor === currentFloor) return; isMoving = true;
            
            document.querySelectorAll('.phys-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${floor}`).classList.add('active');
            document.getElementById('main-card').classList.remove('visible');
            
            playSfx('click');
            document.body.className = "closed";

            setTimeout(() => {
                const motor = playSfx('motor');
                document.getElementById('floor-txt').innerText = "MOV";
                
                // La luz parpadea más al moverse
                document.querySelector('.fluorescent-tube').style.animationDuration = "0.5s";

                setTimeout(() => {
                    motor.stop(); playSfx('ding');
                    currentFloor = floor;
                    document.getElementById('floor-txt').innerText = floor === 0 ? "G" : floor;
                    document.body.className = "open";
                    document.querySelector('.fluorescent-tube').style.animationDuration = "5s"; // Luz normal
                    
                    setTimeout(() => {
                        const data = content[floor];
                        document.getElementById('c-stamp').innerText = data.stamp;
                        document.getElementById('c-title').innerText = data.title;
                        document.getElementById('c-text').innerText = data.text;
                        document.getElementById('c-btn').innerText = data.btn;
                        document.getElementById('main-card').classList.add('visible');
                        speak(data.voice);
                        isMoving = false;
                    }, 1200);
                }, 3500); // Viaje lento y pesado
            }, 1000);
        }

        function playAmbient() {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type='sawtooth'; osc.frequency.value=50; gain.gain.value=0.04; // Zumbido eléctrico grave
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
        }
        function playSfx(type) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now=audioCtx.currentTime;
            if(type==='click'){ osc.frequency.setValueAtTime(500,now); gain.gain.setValueAtTime(0.3,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.15); osc.start(); osc.stop(now+0.15); } // Click pesado
            if(type==='ding'){ osc.type='triangle'; osc.frequency.setValueAtTime(450,now); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+3); osc.start(); osc.stop(now+3); } // Ding viejo
            if(type==='motor'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(35,now); gain.gain.setValueAtTime(0.1,now); osc.start(); return {stop:()=>{gain.gain.linearRampToValueAtTime(0,now+1.5);osc.stop(now+1.5);}}} // Motor pesado
        }
        function speak(text) { 
            window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='es-ES'; u.rate=0.85; u.pitch=0.4; // Voz grave
            const led = document.getElementById('voice-led'); led.classList.add('active');
            u.onend = () => led.classList.remove('active');
            window.speechSynthesis.speak(u); 
        }
    </script>
</body>
</html>
