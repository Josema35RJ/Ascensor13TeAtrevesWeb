<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCENSOR 13 | EL JUICIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #080202;
            --rust-dark: #2a1a15;
            --rust-red: #8b0000;
            --metal: #1a1a1a;
            --bulb-on: #ff3300;
            --paper: #dcd0c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background: var(--bg);
            height: 100vh; overflow: hidden; color: #ccc;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px; font-family: 'Courier Prime', monospace;
        }

        /* --- TEXTURAS Y METAL --- */
        .realistic-metal {
            background-color: var(--metal);
            background-image: 
                url('https://www.transparenttextures.com/patterns/brushed-alum-dark.png'),
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.9) 100%);
            border: 1px solid #333;
            box-shadow: inset 0 0 40px #000;
        }

        /* --- PANTALLA INICIO --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease-out;
        }
        .start-btn {
            background: transparent; color: #666; border: 2px solid #333;
            padding: 20px 60px; font-family: 'Anton'; font-size: 2.5rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 6px; transition: 0.3s;
        }
        .start-btn:hover { border-color: var(--rust-red); color: #ccc; box-shadow: 0 0 40px var(--rust-dark); }

        /* --- ESCENARIO --- */
        #stage { position: relative; width: 100%; height: 100%; max-width: 1400px; transform-style: preserve-3d; }

        .ceiling {
            position: absolute; top: -10%; left: 10%; width: 80%; height: 25%;
            transform: rotateX(80deg); z-index: 5;
            background: #111; border-bottom: 5px solid #000;
            display: flex; justify-content: center;
        }
        .fluorescent-tube {
            width: 70%; height: 12px; background: rgba(255, 250, 240, 0.8); margin-top: 40px;
            box-shadow: 0 0 80px rgba(255, 240, 200, 0.1); border-radius: 4px;
            animation: badFluorescent 10s infinite;
        }

        /* --- PANELES --- */
        .control-panel-box {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 500;
            padding: 25px 15px; border-radius: 2px; border: 4px solid #000;
            pointer-events: auto; background: #181818;
        }
        .panel-left { left: 5%; transform: translateY(-50%) rotateY(20deg) translateZ(50px); width: 130px; }
        .panel-right { right: 5%; transform: translateY(-50%) rotateY(-20deg) translateZ(50px); width: 160px; }
        
        .grill-heavy { width: 100%; height: 40px; background: repeating-linear-gradient(90deg, #111, #111 2px, #222 3px); border: 2px solid #000; margin-bottom: 15px; }
        .analog-led { width: 14px; height: 14px; background: #200; border-radius: 50%; margin: 0 auto; border: 1px solid #000; transition: 0.1s; }
        .analog-led.active { background: #f00; box-shadow: 0 0 25px #f00; }
        .analog-led.glitch-flash { animation: ledFlicker 0.15s infinite; }

        .buttons-grid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .phys-btn {
            width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #444, #222);
            border: 2px solid #111; color: #888; font-family: 'Rajdhani'; font-weight: 700; font-size: 1.2rem;
            display: grid; place-items: center; cursor: pointer; transition: all 0.1s;
            box-shadow: 2px 2px 5px #000;
        }
        .phys-btn:hover { color: #fff; border-color: #555; }
        .phys-btn.active { background: radial-gradient(circle at 30% 30%, #a00, #400); color: #fff; box-shadow: 0 0 15px #f00; border-color: #f00; }
        .phys-btn.haunted { animation: btnHaunt 0.4s infinite alternate; }

        /* --- ESPEJO Y CAMARA --- */
        .mirror-frame {
            position: absolute; top: 8%; left: 20%; width: 60%; height: 84%;
            transform: translateZ(-100px); background: #000; border: 15px solid #1a1a1a; overflow: hidden;
            z-index: 1; box-shadow: inset 0 0 100px #000;
        }
        
        video#webcam { 
            width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); 
            /* Look más oscuro y dramático */
            filter: contrast(1.3) brightness(0.6) sepia(0.4) grayscale(0.5);
            position: absolute; top: 0; left: 0; z-index: 1; 
        }

        .no-signal-bg {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-color: #050505;
            background-image: repeating-linear-gradient(transparent 0px, transparent 1px, rgba(255,255,255,0.1) 1px, rgba(255,255,255,0.1) 2px);
            background-size: 100% 3px;
            animation: staticNoise 0.1s infinite linear;
            z-index: 2; display: none; 
        }

        .mirror-grime {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/black-felt.png'); 
            opacity: 0.6; z-index: 3; pointer-events: none; mix-blend-mode: overlay;
        }
        
        #shadow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-end;
        }
        
        .entity {
            position: absolute; width: 100%; height: 100%; top:0; left:0;
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 1s ease-in-out;
            mix-blend-mode: hard-light; 
            filter: contrast(1.5) grayscale(100%);
        }

        #entity-death { background-image: url('https://cdn.pixabay.com/photo/2013/07/12/12/55/grim-reaper-146552_1280.png'); background-size: contain; background-repeat: no-repeat; background-position: center bottom; }
        #entity-doubt { background-image: url('https://cdn.pixabay.com/photo/2016/11/14/03/38/achieve-1822503_1280.png'); opacity: 0; filter: blur(5px) invert(1); mix-blend-mode: exclusion;}
        #entity-marta { background-image: url('https://cdn.pixabay.com/photo/2016/03/31/19/58/avatar-1295429_1280.png'); background-size: contain; background-repeat: no-repeat; background-position: center bottom; opacity: 0; }

        .entity.active { opacity: 0.8; transform: scale(1.02); transition: transform 8s ease-out, opacity 0.5s; }

        /* --- DISPLAY Y PUERTAS --- */
        .door { position: absolute; top: 0; width: 50%; height: 100%; z-index: 100; transition: transform 4s cubic-bezier(0.6, 0.05, 0.2, 1); background: #111; box-shadow: inset 0 0 20px #000; }
        .door-l { left: 0; border-right: 4px solid #000; }
        .door-r { right: 0; border-left: 4px solid #000; }
        
        .door::after { content:''; position: absolute; width:100%; height:100%; background-image: url('https://www.transparenttextures.com/patterns/brushed-alum-dark.png'); opacity: 0.3; }

        body.open .door-l { transform: translateX(-95%); }
        body.open .door-r { transform: translateX(95%); }

        .display-analog { 
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%); 
            background: #000; padding: 10px 40px; border: 4px solid #222; z-index: 200; 
        }
        #floor-txt { font-family: 'Anton'; font-size: 3rem; color: var(--bulb-on); text-shadow: 0 0 15px var(--bulb-on); white-space: nowrap; letter-spacing: 5px; }

        /* --- CONTENIDO / MODALS --- */
        .content-layer { position: absolute; bottom: 8%; left: 0; width: 100%; z-index: 300; pointer-events: none; display: flex; justify-content: center; }
        .dossier-card {
            width: 420px; background: #dcd0c0; color: #111; padding: 25px; 
            transform: translateY(100px); opacity: 0; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: auto; border: 1px solid #aaa;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            transform-origin: bottom center;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        }
        .dossier-card.visible { opacity: 1; transform: translateY(0) rotate(-1deg); }
        .stamp-sm { border: 2px solid var(--rust-red); color: var(--rust-red); font-family: 'Special Elite'; padding: 2px 6px; display: inline-block; font-size: 0.8rem; font-weight: bold; }
        
        /* MODAL EXPEDIENTE */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: grayscale(1) blur(3px);
            opacity: 0; transition: opacity 0.3s;
        }
        
        .modal-content {
            width: 750px; max-width: 90%; height: 85vh; 
            background: #e6e1d8;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            padding: 60px; position: relative; overflow-y: auto
